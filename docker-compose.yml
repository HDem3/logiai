services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_USER: logiai, POSTGRES_PASSWORD: logiai, POSTGRES_DB: logiai}
    volumes: [logiai-data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U logiai"], interval: 5s, timeout: 5s, retries: 10}
  api:
    build: .
    environment: {DATABASE_URL: postgresql+psycopg://logiai:logiai@db:5432/logiai, LLM_PROVIDER: stub}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
volumes: {logiai-data: {}}


